name: Signed APK release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAUNCHER_STORE_PASSWORD: ${{ secrets.LAUNCHER_STORE_PASSWORD }}
      LAUNCHER_KEY_ALIAS: ${{ secrets.LAUNCHER_KEY_ALIAS }}
      LAUNCHER_KEY_PASSWORD: ${{ secrets.LAUNCHER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          export LAUNCHER_STORE_FILE="$RUNNER_TEMP/launcher-release.jks"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo '::error::Release tags must be vX.Y.Z with components between 0 and 999.'
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo '::error::The derived Android version code is outside its supported range.'
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo '::error::Release tags must point to commits on main.'
            exit 1
          }
          for secret_name in KEYSTORE_BASE64 LAUNCHER_STORE_PASSWORD LAUNCHER_KEY_ALIAS LAUNCHER_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required signing secret $secret_name is missing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$LAUNCHER_STORE_FILE"
          chmod 600 "$LAUNCHER_STORE_FILE"
          echo "LAUNCHER_STORE_FILE=$LAUNCHER_STORE_FILE" >> "$GITHUB_ENV"
          echo "LAUNCHER_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "LAUNCHER_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install pinned Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Check and build signed APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          report=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          actual=$(printf '%s\n' "$report" | sed -n 's/.*certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | sort -u)
          expected=$(tr -d '\r\n' < signing-certificate.sha256)
          test "$actual" = "$expected" || { echo '::error::Release signing identity differs from the pinned certificate.'; exit 1; }
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/launcher.apk
          (cd artifacts && sha256sum launcher.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" artifacts/launcher.apk artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file app/src/main/assets/CHANGELOG.md --verify-tag --latest

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/launcher-release.jks"
